services:
  - type: web
    name: muebles-apartados
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /salud
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: muebles-apartados-db
          property: connectionString
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_NAME
        value: Administrador
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: muebles-apartados-db
    plan: free
    databaseName: muebles_apartados
    user: muebles_admin
