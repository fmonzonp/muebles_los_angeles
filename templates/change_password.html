{% extends 'base.html' %}
{% block title %}Cambiar contraseña{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Cambiar contraseña</h1><p>Use una contraseña distinta y difícil de adivinar.</p></div></div>
<section class="panel"><form method="post"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><div class="form-grid">
<label class="full">Contraseña actual<input name="current_password" type="password" required></label><label>Nueva contraseña<input name="new_password" type="password" minlength="8" required></label><label>Repita la nueva contraseña<input name="repeat_password" type="password" minlength="8" required></label>
</div><div class="form-actions"><a class="btn ghost" href="{{ url_for('dashboard') }}">Cancelar</a><button class="btn primary" type="submit">Actualizar contraseña</button></div></form></section>
{% endblock %}
