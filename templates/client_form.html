{% extends 'base.html' %}
{% block title %}{{ 'Editar cliente' if client else 'Nuevo cliente' }}{% endblock %}
{% block content %}
<div class="page-head"><div><h1>{{ 'Editar cliente' if client else 'Nuevo cliente' }}</h1><p>El código del cliente debe ser único.</p></div></div>
<section class="panel">
<form method="post">
<input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
<div class="form-grid">
<label>Código del cliente *<input name="code" maxlength="40" value="{{ client.code if client else '' }}" required></label>
<label>Nombre completo *<input name="name" value="{{ client.name if client else '' }}" required></label>
<label>Cédula<input name="cedula" value="{{ client.cedula if client else '' }}"></label>
<label>Teléfono / WhatsApp<input name="phone" value="{{ client.phone if client else '' }}"></label>
<label class="full">Dirección<textarea name="address" rows="3">{{ client.address if client else '' }}</textarea></label>
</div>
<div class="form-actions"><a class="btn ghost" href="{{ url_for('clients') }}">Cancelar</a><button class="btn primary" type="submit">Guardar cliente</button></div>
</form>
</section>
{% endblock %}
